name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      # Remove --pass-with-no-tests once e2e tests exist (Task 16).
      - run: npm run e2e -- --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Ensure report folder exists
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -d playwright-report ]; then
            mkdir playwright-report
            echo '<!doctype html><meta charset="utf-8"><title>Playwright report</title><p>画面テストはまだありません。</p>' > playwright-report/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: playwright-report

  deploy-report:
    needs: test
    if: always() && needs.test.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
